name: Release

# Pousse un tag (ex. : git tag v1.0.1 && git push origin v1.0.1) ou crée une
# release depuis GitHub : l'installeur .exe est construit et ajouté à la release.
# La version de l'application est déduite du tag : inutile de modifier package.json.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        run: npm install

      - name: Appliquer la version du tag (v1.2.3 -> 1.2.3)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Version : $VERSION"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Construire et publier
        shell: bash
        run: >
          npx electron-builder --win --publish always
          -c.publish.owner="${{ github.repository_owner }}"
          -c.publish.repo="${{ github.event.repository.name }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
