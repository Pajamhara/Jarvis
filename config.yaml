# ============================================================
#  Configuration de Jarvis
# ============================================================

assistant:
  name: "Jarvis"
  user_title: "Monsieur"     # Comment Jarvis s'adresse à vous (laisser vide = neutre)
  default_city: "Paris"      # Ville utilisée pour la météo si vous n'en précisez pas

wake_word:
  enabled: true              # false = mode "appuyer sur Entrée pour parler"
  model: "hey_jarvis"        # modèle openWakeWord pré-entraîné
  threshold: 0.5             # 0-1. Baissez si Jarvis ne réagit pas, montez s'il se déclenche à tort

audio:
  input_device: null         # null = micro par défaut (voir `python main.py --list-devices`)
  start_timeout: 6.0         # secondes d'attente de votre voix après le mot d'activation
  follow_up_seconds: 6.0     # fenêtre pour enchaîner une 2e demande sans redire "Jarvis"
  silence_duration: 0.8      # silence (s) qui marque la fin de votre phrase (plus court = plus réactif)
  max_duration: 20.0         # durée max d'une demande
  min_rms: 350               # niveau minimal pour considérer qu'on parle (monter si bruyant)

stt:                         # Reconnaissance vocale (faster-whisper, locale, sur GPU NVIDIA)
  model_size: "medium"       # small | medium | large-v3-turbo ... (medium = très bon en français sur une RTX 5070)
  device: "auto"             # auto = GPU si possible, sinon processeur (repli automatique) | cuda | cpu
  compute_type: "float16"    # float16 pour les cartes RTX (RTX 50xx : éviter les variantes int8)
  language: "fr"

tts:                         # Voix de Jarvis
  engine: "piper"            # piper (local, quasi instantané) -> bascule seul sur edge puis pyttsx3 si besoin
  piper_voice: "fr_FR-tom-medium"   # voix masculine ; autres : fr_FR-upmc-medium, fr_FR-siwis-medium (féminine)
                             # (téléchargée automatiquement au 1er lancement dans data/voices)
  voice: "fr-FR-HenriNeural" # voix utilisée si engine = "edge" (en ligne)
  rate: "+0%"                # vitesse de la voix edge

ui:
  orb: true                  # orbe animée (clic = couper la parole, clic droit = menu, glisser = déplacer)
  size: 110

speaker_verification:        # N'obéir qu'à VOTRE voix (optionnel, voir README)
  enabled: false
  threshold: 0.75            # similarité minimale (0-1). Lancez `python main.py --enroll` pour calibrer
  min_duration: 1.0          # durée minimale de parole exploitable (s)
  profile_path: "data/voiceprint.npy"

llm:                         # Cerveau local via Ollama (gratuit, aucune clé API)
  base_url: "http://localhost:11434"
  model: "qwen3.5:9b"        # ~6,6 Go : tient avec Whisper dans les 12 Go de la RTX 5070
                             # alternatives : "qwen3:8b", "qwen3:14b" (plus malin, ~9 Go, tout juste), "llama3.1:8b"
  temperature: 0.3
  num_ctx: 4096              # mémoire de contexte (plus grand = plus de VRAM)
  think: false               # désactive le "mode réflexion" (trop lent pour de la voix)
  keep_alive: "30m"          # garde le modèle en VRAM entre deux demandes
  timeout: 90
  history_turns: 6
  fast_path: true            # commandes simples traitées par règles, sans IA (instantané)
  stream: true               # lit la 1re phrase de la réponse avant la fin de la génération

# Phrases (sans accents, minuscules) qui arrêtent Jarvis
quit_phrases:
  - "au revoir jarvis"
  - "eteins toi"
  - "arrete toi"
  - "quitte jarvis"

# ------------------------------------------------------------
#  Applications que Jarvis a le droit de lancer (LISTE BLANCHE)
#  nom_que_vous_dites: commande | chemin | URI | {path: ..., args: [...]}
#  Jarvis ne lancera JAMAIS rien qui ne soit pas dans cette liste.
# ------------------------------------------------------------
apps:
  navigateur: "msedge"
  chrome: "chrome"
  firefox: "firefox"
  explorateur: "explorer.exe"
  calculatrice: "calc.exe"
  bloc-notes: "notepad.exe"
  paint: "mspaint.exe"
  terminal: "wt.exe"
  gestionnaire des tâches: "taskmgr.exe"
  spotify: "spotify:"
  steam: "steam:"
  word: "winword"
  excel: "excel"
  vscode: "code"
  # discord:
  #   path: 'C:\Users\VOTRE_NOM\AppData\Local\Discord\Update.exe'
  #   args: ["--processStart", "Discord.exe"]

