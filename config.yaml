  gmail: "https://mail.google.com"
  google: "https://www.google.com"
  netflix: "https://www.netflix.com"
  wikipedia: "https://fr.wikipedia.org"
  github: "https://github.com"
  twitch: "https://www.twitch.tv"
  reddit: "https://www.reddit.com"
  amazon: "https://www.amazon.fr"
  facebook: "https://www.facebook.com"
  instagram: "https://www.instagram.com"
  linkedin: "https://www.linkedin.com"
  google maps: "https://www.google.com/maps"
  google drive: "https://drive.google.com"
  prime video: "https://www.primevideo.com"
  disney plus: "https://www.disneyplus.com"
  deezer: "https://www.deezer.com"

# ------------------------------------------------------------
#  Surnoms : ce que vous dites -> nom dans `apps` ou `sites`
# ------------------------------------------------------------
aliases:
  internet: "navigateur"
  web: "navigateur"
  microsoft edge: "navigateur"
  google chrome: "chrome"
  calculette: "calculatrice"
  explorateur de fichiers: "explorateur"
  fichiers: "explorateur"
  bloc note: "bloc-notes"
  notepad: "bloc-notes"
  gestionnaire de taches: "gestionnaire des tâches"
  visual studio code: "vscode"
  code: "vscode"
  invite de commande: "terminal"
  console: "terminal"
  powershell: "terminal"
  musique: "spotify"
  yt: "youtube"
  mail: "gmail"
  mails: "gmail"
